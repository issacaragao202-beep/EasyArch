# ==============================================================================
# EasyArch v5.4 — Hyprland (Ultra-Leve + Glacial Silver + QoL Iniciante)
# Destino: ~/.config/hypr/hyprland.conf
# ==============================================================================

# highrr seleciona automaticamente 1080p@75Hz no monitor físico e 60Hz em VMs sem erro
monitor = , highrr, auto, 1

# --- Variáveis de Ambiente (Wayland + AMDGPU/RADV + Tema Escuro) ---
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = SDL_VIDEODRIVER,wayland,x11
env = MOZ_ENABLE_WAYLAND,1
env = AMD_VULKAN_ICD,RADV
env = XCURSOR_SIZE,24

# --- Sincronização D-Bus / Systemd (portais Wayland e Flatpak sem atraso) ---
# Sincronização sequencial D-Bus/systemd antes de subir o agente polkit (sem condição de corrida)
exec-once = bash -lc 'dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_SESSION_DESKTOP QT_QPA_PLATFORM && systemctl --user import-environment DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_SESSION_DESKTOP QT_QPA_PLATFORM && systemctl --user start hyprpolkitagent.service'
exec-once = swaybg -i "$HOME/.local/share/easyarch/wallpapers/glacial-silver-1080p.svg" -m fill
exec-once = foot --server
exec-once = hypridle
exec-once = swaync
exec-once = swayosd-server
exec-once = waybar
exec-once = nwg-dock-hyprland -d -i 36 -mb 8 -c "$HOME/.local/bin/easyarch-launcher.sh"
exec-once = bash -lc '[[ ! -f "$HOME/.local/state/easyarch-welcome-done" ]] && foot --title="Bem-vindo ao EasyArch" -e "$HOME/.local/bin/easyarch-welcome.sh" --interactive'

input {
    kb_layout = br
    kb_variant = abnt2
    follow_mouse = 1
    sensitivity = 0
    accel_profile = flat
}

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(7dd3fcee) rgba(c9d4e0cc) 45deg
    col.inactive_border = rgba(2c3645aa)
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 14
    active_opacity = 1.0
    inactive_opacity = 0.95

    # Vidro fosco leve (1 passagem + xray): custo mínimo na Vega 11; desliga no Modo Ultra-Leve
    blur {
        enabled = true
        size = 4
        passes = 1
        new_optimizations = true
        xray = true
    }

    shadow {
        enabled = false
    }
}

animations {
    enabled = true
    bezier = hudOut, 0.16, 1.0, 0.3, 1.0
    animation = windows, 1, 3.2, hudOut, popin 84%
    animation = windowsOut, 1, 2.8, hudOut, popin 84%
    animation = border, 1, 3.5, default
    animation = fade, 1, 2.8, hudOut
    animation = workspaces, 1, 3.4, hudOut, slidefade 15%
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

render {
    direct_scanout = 1
}

xwayland {
    force_zero_scaling = true
}

dwindle {
    pseudotile = true
    preserve_split = true
}

# Sintaxe compatível com Hyprland moderno (0.53+ no Arch Linux)
windowrule = match:class ^(pavucontrol|org\.pulseaudio\.pavucontrol|nm-connection-editor|zenity)$, float on

# Vidro fosco real nos overlays HUD (Rofi central, Waybar flutuante e notificações Mako)
layerrule {
    name = easyarch-hud-blur
    match:namespace = ^(rofi|waybar|swaync-control-center|swaync-notification-window|swayosd)$
    blur = true
}
# Nota: para habilitar `immediate on` em jogos, altere também `general:allow_tearing = true`:
# windowrule = match:class ^(steam_app_.*|gamescope)$, immediate on

# --- Atalhos Principais e QoL para Iniciantes ---
$mainMod = SUPER

bind = $mainMod, Return, exec, bash -lc 'if pgrep -u "$(id -u)" -f "(^|/)foot([[:space:]]|$).*--server" >/dev/null 2>&1; then exec footclient; else exec foot; fi'
# Toque único na tecla Super (Windows) OU SUPER + Space abre a cápsula central translúcida
bindr = SUPER, SUPER_L, exec, $HOME/.local/bin/easyarch-launcher.sh
bind = $mainMod, Space, exec, $HOME/.local/bin/easyarch-launcher.sh
bind = ALT, Tab, cyclenext,
bind = ALT SHIFT, Tab, cyclenext, prev

# --- Recursos HUD v5.1 (0 MB de RAM residente) ---
bind = $mainMod, Z, exec, $HOME/.local/bin/easyarch-zen.sh toggle
bind = $mainMod, C, exec, $HOME/.local/bin/easyarch-calc.sh
bind = $mainMod, N, exec, swaync-client -t -sw
bind = $mainMod, Escape, exec, foot --title="EasyArch — Monitor btop" -e btop
bind = $mainMod SHIFT, T, exec, $HOME/.local/bin/easyarch-theme.sh
bind = $mainMod, S, togglespecialworkspace, hud
bind = $mainMod SHIFT, S, movetoworkspace, special:hud
bind = $mainMod, G, togglegroup,
bind = $mainMod, Tab, changegroupactive, f
bind = $mainMod, mouse_down, exec, bash -lc 'z=$(hyprctl getoption cursor:zoom_factor -j | jq -r "(.float * 1.15) | if . > 4 then 4 else . end" 2>/dev/null); [[ -n "$z" ]] && hyprctl -q keyword cursor:zoom_factor "$z"'
bind = $mainMod, mouse_up, exec, bash -lc 'z=$(hyprctl getoption cursor:zoom_factor -j | jq -r "(.float / 1.15) | if . < 1 then 1 else . end" 2>/dev/null); [[ -n "$z" ]] && hyprctl -q keyword cursor:zoom_factor "$z"'
bind = $mainMod, 0, exec, hyprctl -q keyword cursor:zoom_factor 1
bind = $mainMod, H, exec, $HOME/.local/bin/easyarch-hub.sh
bind = $mainMod, F1, exec, $HOME/.local/bin/easyarch-cheatsheet.sh
bind = $mainMod, L, exec, hyprlock
bind = $mainMod SHIFT, L, exec, $HOME/.local/bin/easyarch-lite-mode.sh toggle
bind = $mainMod, Q, killactive,
# Usa o menu de energia com confirmação (evita encerrar sessão por engano)
bind = $mainMod, M, exec, $HOME/.local/bin/easyarch-power.sh
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,

bind = $mainMod SHIFT, M, exec, bash -lc 'if pgrep -u "$(id -u)" -f "(^|/)foot([[:space:]]|$).*--server" >/dev/null 2>&1; then term=footclient; else term=foot; fi; "$term" -e bash -lc "if [[ -x \$HOME/.local/bin/05-suite-benchmarks.sh ]]; then \$HOME/.local/bin/05-suite-benchmarks.sh captura-rapida; else \$HOME/.local/bin/01-relatorio-memoria.sh --show captura-rapida; fi; read -n 1 -r -p \"Pressione qualquer tecla...\""'
bind = $mainMod SHIFT, P, exec, bash -lc 'if pgrep -u "$(id -u)" -f "(^|/)foot([[:space:]]|$).*--server" >/dev/null 2>&1; then term=footclient; else term=foot; fi; "$term" -e bash -lc "if [[ -x \$HOME/.local/bin/easyarch-profile.sh ]]; then \$HOME/.local/bin/easyarch-profile.sh status; else echo \"[EasyArch] Instale a Etapa 3/4 para usar perfis.\"; fi; read -n 1 -r -p \"Pressione qualquer tecla...\""'
bind = , Print, exec, bash -lc 'geom=$(slurp) && [[ -n "$geom" ]] && { dir="$(xdg-user-dir PICTURES 2>/dev/null || echo "$HOME/Pictures")/Capturas"; mkdir -p "$dir"; file="$dir/captura-$(date +%Y%m%d-%H%M%S).png"; grim -g "$geom" "$file" && wl-copy < "$file" && notify-send "Captura salva" "$file"; }'
bind = SHIFT, Print, exec, bash -lc 'dir="$(xdg-user-dir PICTURES 2>/dev/null || echo "$HOME/Pictures")/Capturas"; mkdir -p "$dir"; file="$dir/captura-$(date +%Y%m%d-%H%M%S).png"; grim "$file" && wl-copy < "$file" && notify-send "Captura salva" "$file"'

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6

bindel = , XF86AudioRaiseVolume, exec, bash -lc 'command -v swayosd-client >/dev/null 2>&1 && swayosd-client --output-volume +5 || wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+'
bindel = , XF86AudioLowerVolume, exec, bash -lc 'command -v swayosd-client >/dev/null 2>&1 && swayosd-client --output-volume -5 || wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%-'
bindl  = , XF86AudioMute, exec, bash -lc 'command -v swayosd-client >/dev/null 2>&1 && swayosd-client --output-volume mute-toggle || wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle'

bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioNext, exec, playerctl next
bindl  = , XF86AudioPrev, exec, playerctl previous

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# --- EasyArch v5.4 QoL Real (Auto-Mount Pendrive, Histórico Ctrl+C, Arquivos, Energia) ---
exec-once = udiskie --smart-tray --appindicator
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

bind = $mainMod, E, exec, thunar
bind = $mainMod SHIFT, V, exec, bash -lc 'sel=$(cliphist list | rofi -dmenu -no-custom -p "Histórico Ctrl+C") && [[ -n "$sel" ]] && printf "%s" "$sel" | cliphist decode | wl-copy'
bind = $mainMod, BackSpace, exec, $HOME/.local/bin/easyarch-power.sh
