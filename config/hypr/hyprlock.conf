# ==============================================================================
# EasyArch v5.4 — Hyprlock (Tela de Bloqueio Minimalista Glacial Silver)
# Destino: ~/.config/hypr/hyprlock.conf
# ==============================================================================

general {
    hide_cursor = true
}

background {
    monitor =
    color = rgba(7, 10, 15, 1.0)
}

label {
    monitor =
    text = $TIME
    color = rgba(237, 244, 250, 0.95)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 110
    halign = center
    valign = center
}

label {
    monitor =
    text = EasyArch · Glacial Silver
    color = rgba(125, 211, 252, 0.85)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 45
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 46
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.25
    dots_center = true
    outer_color = rgba(125, 211, 252, 0.75)
    inner_color = rgba(18, 25, 35, 0.92)
    font_color = rgba(237, 244, 250, 1.0)
    fade_on_empty = false
    placeholder_text = <i>Digite sua senha...</i>
    rounding = -1
    check_color = rgba(110, 231, 183, 0.85)
    fail_color = rgba(248, 113, 113, 0.90)
    position = 0, -40
    halign = center
    valign = center
}
