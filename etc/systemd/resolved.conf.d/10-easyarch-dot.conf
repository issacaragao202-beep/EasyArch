# ==============================================================================
# EasyArch v5.4 — systemd-resolved com DNS-over-TLS (DoT)
# Destino: /etc/systemd/resolved.conf.d/10-easyarch-dot.conf
#
# Correção v4.2:
#   - Adicionado `Domains=~.` para que o resolved roteie consultas pelos servidores
#     globais com DoT (Quad9/Cloudflare), evitando falhas quando o NetworkManager
#     recebe DNS local via DHCP que não suporta porta TCP 853.
#   - Em redes com portal cativo (hotel/aeroporto) que bloqueiem TCP 853, altere
#     temporariamente para `DNSOverTLS=opportunistic` e reinicie systemd-resolved.
# ==============================================================================

[Resolve]
DNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net 2620:fe::fe#dns.quad9.net
FallbackDNS=1.1.1.1#cloudflare-dns.com 1.0.0.1#cloudflare-dns.com
Domains=~.
DNSOverTLS=yes
DNSSEC=allow-downgrade
LLMNR=no
MulticastDNS=no
