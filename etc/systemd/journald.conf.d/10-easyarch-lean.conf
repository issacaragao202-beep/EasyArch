# ==============================================================================
# EasyArch v5.4 — Limite Enxuto do systemd-journald (RAM + SSD 240 GB)
# Destino: /etc/systemd/journald.conf.d/10-easyarch-lean.conf
# ==============================================================================

[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=150M
SystemMaxFileSize=25M
RuntimeMaxUse=32M
RuntimeMaxFileSize=8M
MaxRetentionSec=14day
