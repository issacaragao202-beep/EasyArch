# ==============================================================================
# EasyArch — Configuração do zram-generator
# Destino: /etc/systemd/zram-generator.conf
#
# Hardware: 8 GB DDR4 (~6 GB utilizáveis devido à Vega 11).
# Política:
#   - Tamanho virtual dinâmico até metade da RAM utilizável, limitado a 3072 MiB (~3 GiB).
#   - NÃO pré-aloca 3 GiB de RAM física; consome RAM somente conforme páginas são comprimidas.
#   - Algoritmo zstd: excelente taxa de compressão (~2.5x a 3x) com baixo custo na CPU Ryzen 5 3400G.
#   - Prioridade 100: sempre utilizada antes de eventual swap em disco.
#   - Requer parâmetro de kernel: zswap.enabled=0 (evita dupla compressão).
# ==============================================================================

[zram0]
zram-size = min(ram / 2, 3072)
compression-algorithm = zstd
swap-priority = 100
fs-type = swap
