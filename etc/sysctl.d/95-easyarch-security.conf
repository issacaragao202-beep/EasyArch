# ==============================================================================
# EasyArch v5.4 — Parâmetros sysctl de Segurança (Kernel e Rede Documentados)
# Destino: /etc/sysctl.d/95-easyarch-security.conf
#
# Cada parâmetro abaixo tem função e eventuais efeitos colaterais documentados.
# ==============================================================================

# --- Proteção de Kernel ---

# Oculta endereços de ponteiros do kernel em /proc e interfaces similares (dificulta exploits).
# Efeito colateral: ferramentas de profiling de kernel exigem ajuste temporário se necessário.
kernel.kptr_restrict = 2

# Restringe acesso ao buffer dmesg a usuários com CAP_SYSLOG (evita vazamento de endereços/eventos).
# Efeito colateral: rodar `dmesg` exige `sudo dmesg`.
kernel.dmesg_restrict = 1

# Restringe ptrace (Yama LSM): apenas processos pai podem inspecionar filhos.
# Efeito colateral: anexar depuradores (gdb/strace) a processos já em execução exige `sudo`.
kernel.yama.ptrace_scope = 1

# Desabilita eBPF para usuários não privilegiados (valor 2 mantém bloqueio a não-root
# e evita erro EPERM ao reaplicar `sysctl --system` no mesmo boot).
kernel.unprivileged_bpf_disabled = 2

# Aplica hardening ao compilador JIT do eBPF para todos os usuários.
net.core.bpf_jit_harden = 2

# Impede criação de hardlinks/symlinks inseguros em diretórios graváveis como /tmp.
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2

# --- Proteção de Rede ---

# Filtro de caminho reverso estrito (proteção contra IP spoofing).
# Efeito colateral: em setups com múltiplas rotas assimétricas ou certas VPNs, pode exigir valor 2 (loose).
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Proteção contra ataques SYN flood.
net.ipv4.tcp_syncookies = 1

# Ignora redirecionamentos ICMP (evita manipulação de tabela de roteamento / MITM).
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Bloqueia pacotes com source routing (técnica clássica de spoofing/evasão).
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# Protege contra ataques Smurf (ICMP broadcast) e respostas ICMP malformadas.
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1

# Proteção contra TIME-WAIT assassination (RFC 1337).
net.ipv4.tcp_rfc1337 = 1
