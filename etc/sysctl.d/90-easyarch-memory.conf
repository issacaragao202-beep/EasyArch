# ==============================================================================
# EasyArch — Parâmetros sysctl de Memória (Otimizados para ZRAM + SSD SATA)
# Destino: /etc/sysctl.d/90-easyarch-memory.conf
# ==============================================================================

# Swappiness inicial adequado à ZRAM (diferente de swappiness=10 usado em HDDs).
# Permite que páginas anônimas inativas sejam comprimidas na ZRAM preservando cache de arquivos.
# Valor inicial: 100 (será comparado via benchmark com 60 e 150 na Etapa 3/10).
vm.swappiness = 100

# Como a ZRAM está em RAM (acesso aleatório instantâneo), desativa leitura antecipada
# de múltiplas páginas por vez (valor padrão 3 = 8 páginas), reduzindo latência.
vm.page-cluster = 0

# Reduz picos de recuperação agressiva de memória que causam micro-travamentos em 6 GB.
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125

# Mantém equilíbrio padrão entre cache de dentry/inode e páginas anônimas.
vm.vfs_cache_pressure = 100

# Limites absolutos de dirty pages (64 MiB background / 256 MiB limite) para evitar
# rajadas longas de escrita síncrona no SSD SATA Kingston A400 (DRAM-less).
vm.dirty_background_bytes = 67108864
vm.dirty_bytes = 268435456
