# ==============================================================================
# EasyArch v5.4 — Garante symlink /etc/resolv.conf -> stub-resolv.conf no boot
# Destino: /etc/tmpfiles.d/10-easyarch-resolv.conf (instalado apenas em chroot)
# Nota: Para usar DNS manual persistente em /etc/resolv.conf, remova este arquivo.
# ==============================================================================
L+ /etc/resolv.conf - - - - /run/systemd/resolve/stub-resolv.conf
