#!/usr/bin/nft -f
# ==============================================================================
# EasyArch v5.4 — Firewall nftables (Tabela Isolada sem flush ruleset global)
# Destino: /etc/nftables.conf
#
# Correções estruturais v4.1/v4.2:
#   - Em vez de `flush ruleset` (que apaga regras de containers/VMs de terceiros),
#     cria e limpa apenas a tabela própria `inet easyarch_filter`.
# ==============================================================================

table inet easyarch_filter
flush table inet easyarch_filter

table inet easyarch_filter {
    chain input {
        type filter hook input priority filter; policy drop;

        ct state established,related accept
        ct state invalid drop
        iifname "lo" accept

        ip protocol icmp icmp type { destination-unreachable, time-exceeded, parameter-problem } accept
        ip protocol icmp icmp type echo-request limit rate 5/second burst 10 packets accept

        meta l4proto ipv6-icmp icmpv6 type {
            destination-unreachable,
            packet-too-big,
            time-exceeded,
            parameter-problem,
            nd-router-advert,
            nd-neighbor-solicit,
            nd-neighbor-advert
        } accept
        meta l4proto ipv6-icmp icmpv6 type echo-request limit rate 5/second burst 10 packets accept

        udp dport 68 accept
        udp dport 546 accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}

include "/etc/nftables.d/*.nft"
